name: Push Release Tagged Operator UI

on:
  push:
    branches:
      - deployment
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: publish-citrineos-operator-ui
  queue: max
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        image:
          - name: citrineos-operator-ui
            context: ./
            dockerfile: ./apps/operator-ui/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Check package visibility and latest revision
        id: publish
        uses: actions/github-script@v9
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.packages.getPackageForOrganization({
                org: owner,
                package_type: 'container',
                package_name: process.env.IMAGE_NAME,
              });
              if (data.visibility !== 'private') {
                throw new Error(`Package ${process.env.IMAGE_NAME} must be private.`);
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            let latest = true;
            if (context.ref === 'refs/heads/deployment') {
              const { data } = await github.rest.repos.getBranch({ owner, repo, branch: 'deployment' });
              latest = data.commit.sha === context.sha;
            }
            core.setOutput('latest', String(latest));

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.image.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.image.name }}-

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.sha }},enable=${{ github.ref == 'refs/heads/deployment' }}
            type=raw,value=latest,enable=${{ steps.publish.outputs.latest == 'true' }}

      - name: Build and push operator-ui image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Verify private package and summarize publication
        uses: actions/github-script@v9
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const { data } = await github.rest.packages.getPackageForOrganization({
              org: context.repo.owner,
              package_type: 'container',
              package_name: process.env.IMAGE_NAME,
            });
            if (data.visibility !== 'private') {
              throw new Error(`Package ${process.env.IMAGE_NAME} must be private.`);
            }
            await core.summary
              .addHeading(`Published ${process.env.IMAGE_NAME}`)
              .addCodeBlock(process.env.IMAGE_TAGS)
              .addTable([
                [{ data: 'Commit', header: true }, context.sha],
                [{ data: 'Digest', header: true }, process.env.IMAGE_DIGEST],
                [{ data: 'Visibility', header: true }, data.visibility],
              ])
              .write();

      # Move cache to avoid ever-growing cache
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
