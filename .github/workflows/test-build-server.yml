name: Test Server on Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      shared: ${{ steps.filter.outputs.shared }}
      build-required: ${{ steps.filter.outputs.server == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
            server:
              - 'apps/ocpp-server/**'
              - 'packages/**'
              - 'docker-compose*.yml'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.build-required == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and Run Docker Compose
        run: docker compose -f ${{ github.workspace }}/docker-compose.yml -f ${{ github.workspace }}/docker-compose.local.yml up -d --build

      - name: Install Newman
        run: |
          npm install -g newman
          sleep 10

      - name: Integration test
        run: |
          RETRY_COUNT=0
          MAX_RETRIES=5
          RETRY_DELAY=10
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            newman run ${{ github.workspace }}/.github/workflows/tests/CI/collection.json -e ${{ github.workspace }}/.github/workflows/tests/CI/environment.json --reporters cli && exit 0
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Integration tests failed after $MAX_RETRIES attempts." >&2
              exit 1
            fi
            echo "Retry $RETRY_COUNT/$MAX_RETRIES in $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          done
        shell: bash

      - name: Get logs for all containers
        if: failure()
        run: |
          docker ps -a
          docker container ls -aq | xargs -I {} docker logs {}

      - name: Clean up
        if: always()
        run: docker compose -f ${{ github.workspace }}/docker-compose.yml -f ${{ github.workspace }}/docker-compose.local.yml down

  server-integration-ci:
    name: Server Integration CI
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check integration results
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build-required }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const expected = {
            changes: 'success',
            build: process.env.BUILD_REQUIRED === 'true' ? 'success' : 'skipped',
          };
          for (const [job, result] of Object.entries(expected)) {
            if (results[job]?.result !== result) {
              console.error(`${job}: expected ${result}, received ${results[job]?.result}`);
              process.exitCode = 1;
            }
          }
          NODE
